<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#254F91"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2E9E4F"/></marker>
    <style>
      .t { font-size: 22px; font-weight: 700; fill: #0B2D6B }
      .h { font-size: 17px; font-weight: 700; fill: #0B2D6B }
      .b { font-size: 14px; fill: #33415C }
      .s { font-size: 12.5px; fill: #5B6B88 }
      .l { font-size: 13px; fill: #254F91; font-weight: 600 }
      .box { fill: #FFFFFF; stroke: #C9D5EA; stroke-width: 1.5 }
      .in { fill: #FFFFFF; stroke: #D5DFF0; stroke-width: 1.2 }
      .ln { stroke: #254F91; stroke-width: 2.2; fill: none }
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#FFFFFF"/>

  <!-- header -->
  <image href="../brand/biocanary-logo.svg" x="60" y="34" width="270" height="40"/>
  <text x="1540" y="56" text-anchor="end" class="t">Technical architecture</text>
  <text x="1540" y="80" text-anchor="end" class="s">Biological early warning for wastewater · deployment on Huawei Cloud</text>
  <line x1="60" y1="104" x2="1540" y2="104" stroke="#E3EAF5" stroke-width="2"/>

  <!-- device -->
  <rect x="60" y="180" width="280" height="400" rx="18" class="box"/>
  <text x="80" y="214" class="h">BIOCANARY device</text>
  <text x="80" y="236" class="s">On the influent, basin or industrial line</text>
  <rect x="78" y="256" width="120" height="170" rx="12" fill="#E3ECFF" stroke="#2F6BFF" stroke-width="1.6"/>
  <rect x="90" y="320" width="96" height="92" rx="6" fill="#2F6BFF" opacity=".22"/>
  <text x="138" y="282" text-anchor="middle" class="l" style="fill:#2F6BFF">Reference</text>
  <text x="138" y="300" text-anchor="middle" class="s">protected culture</text>
  <rect x="206" y="256" width="120" height="170" rx="12" fill="#E6F9EA" stroke="#4FD96B" stroke-width="1.6"/>
  <rect x="218" y="320" width="96" height="92" rx="6" fill="#4FD96B" opacity=".28"/>
  <text x="266" y="282" text-anchor="middle" class="l" style="fill:#2E9E4F">Test</text>
  <text x="266" y="300" text-anchor="middle" class="s">wastewater sample</text>
  <text x="80" y="456" class="b">Same culture in both chambers.</text>
  <text x="80" y="476" class="b">Divergence = inhibition signal.</text>
  <text x="80" y="508" class="s">Sensors: activity, dissolved oxygen,</text>
  <text x="80" y="526" class="s">temperature; pH, conductivity, flow</text>
  <text x="80" y="556" class="s">Buffers readings offline, retries safely</text>

  <rect x="60" y="610" width="280" height="86" rx="14" fill="#FFF8EC" stroke="#E9C88A" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="80" y="640" class="h" style="fill:#8A5A12">Simulator (demo)</text>
  <text x="80" y="662" class="s">Simulated stations, same device API,</text>
  <text x="80" y="680" class="s">labelled "Simulated data" everywhere</text>

  <!-- device → ECS -->
  <path d="M340 380 H470" class="ln" marker-end="url(#a)"/>
  <text x="392" y="368" text-anchor="middle" class="l">HTTPS</text>
  <text x="392" y="400" text-anchor="middle" class="s">device key</text>
  <path d="M340 650 H420 V420 H470" class="ln" stroke-dasharray="6 5" marker-end="url(#a)"/>

  <!-- Huawei Cloud VPC -->
  <rect x="446" y="140" width="1134" height="590" rx="24" fill="#F7FAFF" stroke="#254F91" stroke-width="1.8" stroke-dasharray="9 7"/>
  <rect x="472" y="126" width="316" height="30" rx="15" fill="#254F91"/>
  <text x="630" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Huawei Cloud · one region, one VPC</text>

  <!-- ECS -->
  <rect x="470" y="180" width="480" height="520" rx="18" fill="#EEF3FF" stroke="#254F91" stroke-width="1.8"/>
  <text x="490" y="214" class="h">ECS</text>
  <text x="530" y="214" class="s">Docker Compose · scales out behind an ELB</text>

  <rect x="490" y="232" width="440" height="56" rx="10" class="in"/>
  <text x="508" y="256" class="b" font-weight="700">nginx · web app</text>
  <text x="508" y="276" class="s">Serves the React interface, proxies the API (TLS at the ELB)</text>

  <rect x="490" y="300" width="440" height="72" rx="10" class="in"/>
  <text x="508" y="324" class="b" font-weight="700">Ingestion API (FastAPI)</text>
  <text x="508" y="344" class="s">Device authentication · each value judged valid, suspect,</text>
  <text x="508" y="361" class="s">invalid or missing · stored either way · replies 202</text>

  <rect x="490" y="384" width="440" height="118" rx="10" fill="#FFFFFF" stroke="#4FD96B" stroke-width="1.8"/>
  <text x="508" y="408" class="b" font-weight="700">Analysis pipeline · every 10 minutes</text>
  <text x="508" y="430" class="s">1  Inhibition indicator  I = 100 × (A_ref − A_exp) / A_ref</text>
  <text x="508" y="449" class="s">2  Anomaly detection: robust z-score + CUSUM vs own history</text>
  <text x="508" y="468" class="s">3  Severity: protocol ranges or calibrated classifier</text>
  <text x="508" y="487" class="s">4  Contributing factors (association, not cause) · explanation</text>

  <rect x="490" y="514" width="440" height="72" rx="10" class="in"/>
  <text x="508" y="538" class="b" font-weight="700">Alerts and reports</text>
  <text x="508" y="558" class="s">Open after two abnormal assessments (severe: at once)</text>
  <text x="508" y="575" class="s">PDF and CSV reports · acknowledgement trail</text>

  <rect x="490" y="598" width="440" height="84" rx="10" class="in"/>
  <text x="508" y="622" class="b" font-weight="700">Background worker</text>
  <text x="508" y="642" class="s">Probes all five services every 30 s (ECS metadata, SQL,</text>
  <text x="508" y="659" class="s">PING, HeadBucket, /health) · daily raw archives · locks</text>

  <!-- managed services -->
  <g>
    <rect x="1030" y="180" width="500" height="100" rx="16" class="box"/>
    <rect x="1030" y="180" width="8" height="100" rx="4" fill="#254F91"/>
    <text x="1056" y="212" class="h">RDS for PostgreSQL</text>
    <text x="1056" y="236" class="b">Readings with quality, assessments, alerts,</text>
    <text x="1056" y="256" class="b">protocols (versioned), users · SSL, backups</text>

    <rect x="1030" y="296" width="500" height="100" rx="16" class="box"/>
    <rect x="1030" y="296" width="8" height="100" rx="4" fill="#2F6BFF"/>
    <text x="1056" y="328" class="h">DCS for Redis</text>
    <text x="1056" y="352" class="b">Live station state, update events (pub/sub),</text>
    <text x="1056" y="372" class="b">worker locks across instances, sign-in limits</text>

    <rect x="1030" y="412" width="500" height="100" rx="16" class="box"/>
    <rect x="1030" y="412" width="8" height="100" rx="4" fill="#83E6A3"/>
    <text x="1056" y="444" class="h">OBS</text>
    <text x="1056" y="468" class="b">Daily raw archives (gzip CSV), generated</text>
    <text x="1056" y="488" class="b">reports, training datasets · private bucket</text>

    <rect x="1030" y="528" width="500" height="172" rx="16" fill="#F3FFF5" stroke="#4FD96B" stroke-width="1.6"/>
    <rect x="1030" y="528" width="8" height="172" rx="4" fill="#4FD96B"/>
    <text x="1056" y="560" class="h">ModelArts + SWR · MindSpore</text>
    <rect x="1056" y="574" width="456" height="52" rx="10" class="in"/>
    <text x="1072" y="596" class="b" font-weight="700">Real-time service</text>
    <text x="1072" y="615" class="s">Classifier 7→16→4, POST /infer, GET /health, AppCode or IAM</text>
    <rect x="1056" y="636" width="456" height="52" rx="10" class="in"/>
    <text x="1072" y="658" class="b" font-weight="700">Training job</text>
    <text x="1072" y="677" class="s">MindSpore image, ml/train.py, calibrated output to OBS</text>
  </g>

  <!-- ECS ↔ services -->
  <path d="M950 230 H1030" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="990" y="222" text-anchor="middle" class="s">SQL</text>
  <path d="M950 346 H1030" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="990" y="338" text-anchor="middle" class="s">Redis</text>
  <path d="M950 462 H1030" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="990" y="454" text-anchor="middle" class="s">S3 API</text>
  <path d="M950 600 H1056" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="996" y="592" text-anchor="middle" class="s">HTTPS</text>
  <!-- OBS datasets → training -->
  <path d="M1530 470 H1542 V660 H1512" stroke="#2E9E4F" stroke-width="2.2" fill="none" marker-end="url(#g)"/>
  <text x="1550" y="566" class="s" transform="rotate(90 1550 566)" text-anchor="middle">datasets</text>

  <!-- ECS → operators -->
  <path d="M710 700 V790" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="724" y="752" class="l">REST + server-sent events (live updates)</text>

  <!-- operators -->
  <rect x="470" y="790" width="1060" height="150" rx="18" fill="#0B2D6B"/>
  <text x="494" y="824" font-size="17" font-weight="700" fill="#FFFFFF">Operators and control room</text>
  <text x="494" y="846" font-size="13" fill="#C6D2EA">React web app · three.js 3D facility · honest status: Huawei Cloud "connected" only when all five probes pass</text>
  <g font-size="14" font-weight="700" fill="#0B2D6B">
    <rect x="494" y="866" width="148" height="44" rx="22" fill="#A6F684"/><text x="568" y="893" text-anchor="middle">Dashboard</text>
    <rect x="652" y="866" width="160" height="44" rx="22" fill="#F0FFD7"/><text x="732" y="893" text-anchor="middle">Facility (3D)</text>
    <rect x="822" y="866" width="148" height="44" rx="22" fill="#F0FFD7"/><text x="896" y="893" text-anchor="middle">Monitoring</text>
    <rect x="980" y="866" width="148" height="44" rx="22" fill="#F0FFD7"/><text x="1054" y="893" text-anchor="middle">AI Analysis</text>
    <rect x="1138" y="866" width="130" height="44" rx="22" fill="#F0FFD7"/><text x="1203" y="893" text-anchor="middle">Reports</text>
    <rect x="1278" y="866" width="228" height="44" rx="22" fill="none" stroke="#83E6A3" stroke-width="1.5"/><text x="1392" y="893" text-anchor="middle" fill="#F0FFD7">Control-room wall display</text>
  </g>

  <!-- legend / note -->
  <text x="60" y="980" class="s">Each service is selected by an environment variable (local stand-in or Huawei Cloud) and verified by a live probe. The system never silently falls back from ModelArts.</text>
</svg>
