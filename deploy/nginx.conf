server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 4m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    # Replaced, not appended, so a client cannot choose the address used for sign-in limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location = /api/v1/stream {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location /device/ {
    types { model/gltf-binary glb; image/webp webp; }
    expires 1h;
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}
